[project]
name = "folio-mcp"
version = "0.1.0"
description = "Working memory for AI companions — mutable markdown notes via MCP"
requires-python = ">=3.11"
dependencies = [
    "fastmcp",
    "python-frontmatter",
    "gitpython",
    "notion-client",
    "supabase",
]

[project.scripts]
folio-mcp = "folio.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/folio"]
